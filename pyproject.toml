[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "k11-appium-qa-mcp"
version = "0.1.0"
description = "MCP server and CI tool for self-healing Appium locators in native and hybrid Android and iOS apps: heals against the screen a test failed on, verified re-runs, Python and Java Page Objects, accessibility checks, audit trail."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "K11 Software Solutions" }]
requires-python = ">=3.10"
keywords = ["mcp", "appium", "mobile-testing", "android", "ios", "self-healing", "test-automation", "accessibility", "qa", "claude"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = ["mcp>=1.20,<2", "lxml>=5", "pyyaml>=6"]

[project.optional-dependencies]
live = ["Appium-Python-Client>=4"]
dev = ["pytest>=8", "pytest-timeout>=2", "Appium-Python-Client>=4"]

[project.urls]
Homepage = "https://github.com/K11-Software-Solutions/k11techlab-appium-qa-mcp"
Issues = "https://github.com/K11-Software-Solutions/k11techlab-appium-qa-mcp/issues"

[project.scripts]
k11-appium-qa-mcp = "k11_appium_qa.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/k11_appium_qa"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
